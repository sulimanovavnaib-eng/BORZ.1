function toast(text){

 $("toast").textContent = text;
 $("toast").style.display = "block";

 clearTimeout(window.__toastTimer);

 window.__toastTimer = setTimeout(() => {

  $("toast").style.display = "none";

 },2600);

}


function speak(text){

 if(!("speechSynthesis" in window)) return;

 speechSynthesis.cancel();

 const u = new SpeechSynthesisUtterance(text);

 u.lang = "ru-RU";
 u.rate = .95;

 speechSynthesis.speak(u);

}


function setStatus(text){

 $("aiStatus").textContent = text;

}


/* =========================================================
   КАМЕРА
   ========================================================= */

async function startCamera(){

 if(
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
 ){

  toast(
   "Камера требует HTTPS. Открой GitHub Pages через HTTPS."
  );

  return false;
 }

 try{

  if(stream){

   $("camera").classList.add("on");

   setStatus("Камера уже подключена");

   return true;
  }

  setStatus("Запрашиваю доступ к камере…");

  stream = await navigator.mediaDevices.getUserMedia({

   video:{
    facingMode:{ideal:"environment"},
    width:{ideal:1280},
    height:{ideal:720}
   },

   audio:false

  });

  $("camera").srcObject = stream;

  $("camera").classList.add("on");

  $("recognition").textContent =
   "Камера ONLINE · готова к сканированию";

  $("objectInfo").textContent =
   "Нажми «Сканировать»";

  setStatus("Камера ONLINE · BORZ готов");

  toast("Задняя камера BORZ включена");

  return true;

 }catch(e){

  console.error(e);

  setStatus("Нет доступа к камере");

  toast(
   "Камера: " + (e.name || "доступ запрещён")
  );

  return false;

 }

}

/* =========================================================

function selectDetection(index){

 lastDetection = p;

  RU[p.class] || p.class;

 currentObject = name;

  name,

  allDetections,

  confidence
  ? `${name} · обнаружен · ${Math.round(confidence*100)}%`
  : `${name} · выбран`;

/* =========================================================
   РАМКИ ВСЕХ ОБЪЕКТОВ
   ========================================================= */

function clearDetectionBoxes(){

 document
  .querySelectorAll(".borz-box")
  .forEach(el => el.remove());

}


function getVideoDisplayRect(){

 const video = $("camera");

 const vw =
  video.videoWidth || 1280;

 const vh =
  video.videoHeight || 720;

 const cw = innerWidth;
 const ch = innerHeight;

 const scale =
  Math.max(cw/vw,ch/vh);

 const dw = vw * scale;
 const dh = vh * scale;

 const offsetX =
  (cw-dw)/2;

 const offsetY =
  (ch-dh)/2;

 return {
  scale,
  offsetX,
  offsetY
 };

}


function drawDetectionBoxes(predictions,selectedIndex){

 clearDetectionBoxes();

 const video = $("camera");

 if(video.style.display === "none") return;

 const rect =
  getVideoDisplayRect();

 predictions.forEach((p,index)=>{

  const [x,y,w,h] = p.bbox;

  const box =
   document.createElement("div");

  box.className = "borz-box";

  box.style.position = "absolute";
  box.style.zIndex = "5";
  box.style.pointerEvents = "auto";

  box.style.left =
   (x * rect.scale + rect.offsetX) + "px";

  box.style.top =
   (y * rect.scale + rect.offsetY) + "px";

  box.style.width =
   Math.max(25,w*rect.scale) + "px";

  box.style.height =
   Math.max(25,h*rect.scale) + "px";

  box.style.border =
   index === selectedIndex
   ? "3px solid #69eaff"
   : "2px solid rgba(105,234,255,.55)";

  box.style.borderRadius = "8px";

  box.style.boxShadow =
   index === selectedIndex
   ? "0 0 20px rgba(105,234,255,.55)"
   : "0 0 10px rgba(105,234,255,.2)";

  const label =
   document.createElement("div");

  const name =
   RU[p.class] || p.class;

  label.textContent =
   `${index+1}. ${name} · ${Math.round(p.score*100)}%`;

  label.style.position = "absolute";
  label.style.left = "0";
  label.style.top = "-24px";
  label.style.padding = "4px 6px";
  label.style.background = "rgba(3,10,15,.92)";
  label.style.border =
   "1px solid rgba(105,234,255,.4)";
  label.style.borderRadius = "6px";
  label.style.fontSize = "10px";
  label.style.whiteSpace = "nowrap";
  label.style.color = "#eafaff";

  box.appendChild(label);

  box.onclick = () => {

   selectDetection(index);

  };

  $("app").appendChild(box);

 });

}


/* =========================================================
   СКАНИРОВАНИЕ
   ========================================================= */

async function scanObject(){

 if(!stream){

  const ok =
   await startCamera();

  if(!ok) return;

 }

 if(!detector){

  const ok =
   await loadDetector();

  if(!ok) return;

 }

 if(detecting) return;

 detecting = true;

 setStatus(
  "BORZ · анализ изображения…"
 );

 try{

  await new Promise(resolve => {

   if($("camera").readyState >= 2){

    resolve();

   }else{

    $("camera").addEventListener(
     "loadeddata",
     resolve,
     {once:true}
    );

   }

  });

  const predictions =
   await detector.detect(
    $("camera"),
    20,
    .35
   );

  allDetections =
   predictions.sort(
    (a,b)=>b.score-a.score
   );

  if(!allDetections.length){

   clearDetectionBoxes();

   $("recognition").textContent =
    "Объекты не найдены";

   $("objectName").textContent =
    "BORZ VISION";

   $("objectInfo").textContent =
    "Направь камеру на объект";

   $("modelStatus").textContent =
    "Модель не выбрана";

   const list =
    $("detectionsList");

   if(list) list.innerHTML = "";

   setStatus(
    "BORZ · сканирование завершено"
   );

   toast("Объекты не найдены");

   return;

  }

  selectedDetectionIndex = 0;

  const first =
   allDetections[0];

  lastDetection = first;

  const firstName =
   RU[first.class] || first.class;

  currentObject =
   firstName;

  updateObject(
   firstName,
   first.score
  );

  drawDetectionBoxes(
   allDetections,
   0
  );

  showAllDetectionInfo(
   allDetections
  );

  $("recognition").textContent =
   `Найдено объектов: ${allDetections.length}`;

  $("objectInfo").textContent =
   `${firstName} выбран · нажми 3D`;

  $("modelStatus").textContent =
   `3D готова: ${firstName}`;

  setStatus(
   "BORZ · все объекты распознаны"
  );

  toast(
   `Найдено объектов: ${allDetections.length}`
  );

 }catch(e){

  console.error(e);

  toast(
   "Ошибка сканирования: " + e.message
  );

  setStatus(
   "Ошибка компьютерного зрения"
  );

 }finally{

  detecting = false;

 }

}

/* =========================================================
   ОЧИСТКА 3D
   ========================================================= */

function disposeObject(obj){

 if(!obj) return;

 obj.traverse(child => {

  if(child.geometry)
   child.geometry.dispose();

  if(child.material){

   if(Array.isArray(child.material)){

    child.material.forEach(
     m => m.dispose()
    );

   }else{

    child.material.dispose();

   }

  }

 });

}

/* =========================================================
   THREE.JS
   ========================================================= */

function initThree(name){

 const canvas =
  $("threeCanvas");

 if(!window.THREE){

  toast(
   "Three.js не загрузился"
  );

  return;

 }

 /* удаляем предыдущую сцену */

 if(threeState){

  if(threeState.object)
   disposeObject(
    threeState.object
   );

  if(threeState.renderer){

   threeState.renderer.dispose();

  }

 }

 const scene =
  new THREE.Scene();

 scene.background =
  new THREE.Color(
   0x02070b
  );

 const camera =
  new THREE.PerspectiveCamera(
   42,
   1,
   .01,
   100
  );

 const renderer =
  new THREE.WebGLRenderer({

   canvas,
   antialias:true,
   alpha:false,
   powerPreference:"high-performance"

  });

 renderer.setPixelRatio(
  Math.min(
   window.devicePixelRatio || 1,
   2
  )
 );

 renderer.outputColorSpace =
  THREE.SRGBColorSpace;


 /* СВЕТ */

 const ambient =
  new THREE.HemisphereLight(
   0x9deeff,
   0x071116,
   2
  );

 scene.add(ambient);

 const light1 =
  new THREE.DirectionalLight(
   0xffffff,
   2.2
  );

 light1.position.set(
   5,7,8
  );

 scene.add(light1);

 const light2 =
  new THREE.DirectionalLight(
   0x4ddfff,
   1.4
  );

 light2.position.set(
   -5,3,-4
  );

 scene.add(light2);


 /* ПОЛ */

 const grid =
  new THREE.GridHelper(
   10,
   20,
   0x176075,
   0x0b2931
  );

 grid.position.y = -1.1;

 scene.add(grid);


 /* МОДЕЛЬ */

 const object =
  make3DObject(name);

 scene.add(object);


 /* ЦЕНТРИРОВКА */

 const box =
  new THREE.Box3()
   .setFromObject(object);

 const center =
  box.getCenter(
   new THREE.Vector3()
  );

 const size =
  box.getSize(
   new THREE.Vector3()
  );

 object.position.sub(center);

 /* повторно рассчитываем */

 const box2 =
  new THREE.Box3()
   .setFromObject(object);

 const center2 =
  box2.getCenter(
   new THREE.Vector3()
  );

 const size2 =
  box2.getSize(
   new THREE.Vector3()
  );

 const maxSize =
  Math.max(
   size2.x,
   size2.y,
   size2.z
  );

 const distance =
  Math.max(
   4,
   maxSize * 2.2
  );

 camera.position.set(
   distance*.8,
   distance*.55,
   distance
  );

 camera.lookAt(
   center2
  );


 /* РАЗМЕР */

 function resize(){

  const w =
   canvas.clientWidth ||
   canvas.parentElement.clientWidth ||
   400;

  const h =
   canvas.clientHeight ||
   canvas.parentElement.clientHeight ||
   300;

  renderer.setSize(
   w,
   h,
   false
  );

  camera.aspect =
   w / h;

  camera.updateProjectionMatrix();

 }


 resize();


 /* УПРАВЛЕНИЕ ПАЛЬЦЕМ */

 let dragging = false;

 let lastX = 0;
 let lastY = 0;

 canvas.style.touchAction =
  "none";

 canvas.onpointerdown =
  e => {

   dragging = true;

   lastX = e.clientX;
   lastY = e.clientY;

   canvas.setPointerCapture?.(
    e.pointerId
   );

  };


 canvas.onpointermove =
  e => {

   if(!dragging) return;

   object.rotation.y +=
    (e.clientX-lastX)*.012;

   object.rotation.x +=
    (e.clientY-lastY)*.008;

   lastX = e.clientX;
   lastY = e.clientY;

  };


 canvas.onpointerup =
  canvas.onpointercancel =
  e => {

   dragging = false;

   try{

    canvas.releasePointerCapture?.(
     e.pointerId
    );

   }catch(_){}

  };


 window.addEventListener(
  "resize",
  resize
 );


 threeState = {

  scene,
  camera,
  renderer,
  object,
  resize

 };


 function animate(){

  if(
   $("threePanel").style.display ===
   "none"
  ){

   return;

  }

  if(!dragging){

   object.rotation.y +=
    .004;

  }

  renderer.render(
   scene,
   camera
  );

  requestAnimationFrame(
   animate
  );

 }

 animate();

}


/* =========================================================
   ЗАКРЫТИЕ 3D
   ========================================================= */

$("close3d").onclick = () => {

 $("threePanel").style.display =

 if(threeState){

function runCommand(q){

 const l =
  q.toLowerCase().trim();

 if(!l) return;

 $("aiStatus").textContent =
  "Выполняю: " + q;


 /* 3D */

 if(
  l.includes("3d") ||
  l.includes("трехмер")
 ){

  let name =
   currentObject;


  if(l.includes("человек"))
   name = "человек";

  else if(l.includes("телевизор"))
   name = "телевизор";

  else if(l.includes("бутыл"))
   name = "бутылка";

  else if(l.includes("стул"))
   name = "стул";

  else if(l.includes("автомоб") ||
          l.includes("машин"))
   name = "автомобиль";

  else if(l.includes("ноутбук"))
   name = "ноутбук";

  else if(l.includes("телефон"))
   name = "телефон";

  else if(l.includes("чаш"))
   name = "чашка";

  else if(l.includes("книг"))
   name = "книга";

  else if(l.includes("собак"))
   name = "собака";

  else if(l.includes("кош"))
   name = "кошка";

  else if(l.includes("рюкзак"))
   name = "рюкзак";

  else if(l.includes("чемодан"))
   name = "чемодан";

  show3D(name);

  speak(
   "Открываю трёхмерную модель " +
   name
  );

  return;

 }


 /* КАМЕРА */

 if(l.includes("камер")){

  startCamera();

  return;

 }


 /* СКАН */

 if(
  l.includes("скан") ||
  l.includes("распозн")
 ){

  scanObject();

  return;

 }


 /* НАВИГАЦИЯ */

 if(
  l.includes("навига") ||
  l.includes("маршрут") ||
  l.includes("куда")
 ){

  navigate();

  return;

 }


 /* ПОИСК */

 if(l.includes("поиск")){

  const q2 =
   l
    .replace(
     /поиск|найди|найти/g,
     ""
    )
    .trim()
   || currentObject;

  window.open(
   "https://www.google.com/search?q="+
   encodeURIComponent(q2),
   "_blank"
  );

  return;

 }


 toast(
  "Команда пока не подключена"
 );

}

function voice(){

 const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if(!SR){

  toast(
   "Голосовой ввод не поддерживается"
  );

  return;

 }

 recognition =
  new SR();

 recognition.lang =
  "ru-RU";

 recognition.interimResults =
  false;

 recognition.continuous =
  false;

 recognition.onstart =
  () => {

   $("voiceBtn")
    .classList.add("active");

   setStatus(
    "BORZ · слушаю…"
   );

   $("aiStatus").textContent =
    "Слушаю команду…";

  };


 recognition.onresult =
  e => {

   const text =
    e.results[0][0].transcript;

   $("aiStatus").textContent =
    "Вы: " + text;

   runCommand(text);

  };


 recognition.onerror =
  e => {

   toast(
    "Ошибка голоса: " +
    e.error
   );

  };


 recognition.onend =
  () => {

   $("voiceBtn")
    .classList.remove("active");

   setStatus(
    "BORZ · готов"
   );

  };


 try{

  recognition.start();

 }catch(e){}

}


/* =========================================================
   НАВИГАЦИЯ
   ========================================================= */

function navigate(){

 if(!navigator.geolocation){

  window.open(
   "https://www.google.com/maps",
   "_blank"
  );

  return;

 }

 setStatus(
  "BORZ · определяю GPS…"
 );

 navigator.geolocation.getCurrentPosition(

  p => {

   const lat =
    p.coords.latitude.toFixed(6);

   const lon =
    p.coords.longitude.toFixed(6);

   $("routeText").textContent =
    `GPS ${lat}, ${lon}`;

   setStatus(
    "BORZ · GPS ONLINE"
   );

   toast(
    "GPS получен"
   );

   window.open(
    `https://www.google.com/maps/dir/?api=1&origin=${lat},${lon}`,
    "_blank"
   );

  },

  () => {

   toast(
    "Разреши геолокацию для сайта"
   );

   setStatus(
    "GPS · нет доступа"
   );

  },

  {
   enableHighAccuracy:true,
   timeout:10000,
   maximumAge:5000
  }

 );

}
