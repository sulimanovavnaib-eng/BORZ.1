<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BORZ — AI Helmet Core</title>
<style>
:root{--cyan:#70e7ff;--bg:#05080c;--panel:rgba(5,10,15,.82);--line:rgba(112,231,255,.35)}
*{box-sizing:border-box}body{margin:0;background:#000;color:#eafaff;font-family:Arial,sans-serif;overflow:hidden}
#app{height:100vh;position:relative;background:radial-gradient(circle at 50% 40%,#10202a 0,#05080c 55%,#000 100%)}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42;display:none}
.hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;letter-spacing:4px;font-size:19px}.status{font-size:12px;border:1px solid var(--line);padding:7px 10px;border-radius:14px;background:var(--panel)}
.left{position:absolute;left:12px;top:72px;width:min(330px,46vw);display:grid;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;backdrop-filter:blur(8px)}
.small{font-size:11px;color:#9eb5be}.value{font-size:14px;margin-top:3px}
.route{position:absolute;right:12px;top:72px;width:min(350px,44vw);height:190px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,rgba(10,30,38,.92),rgba(3,8,12,.88));overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(112,231,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(112,231,255,.08) 1px,transparent 1px);background-size:24px 24px;transform:perspective(350px) rotateX(55deg) scale(1.6);transform-origin:center bottom}
.routeLine{position:absolute;width:72%;height:4px;background:var(--cyan);left:14%;top:57%;transform:rotate(-23deg);box-shadow:0 0 14px var(--cyan);border-radius:5px}
.arrow{position:absolute;right:15%;top:35%;font-size:30px;color:var(--cyan)}
#objectPanel{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);width:min(430px,80vw);text-align:center}
#objectName{font-size:17px;font-weight:700}.badge{display:inline-block;margin-top:6px;padding:5px 9px;border-radius:12px;border:1px solid var(--line);font-size:11px}
.controls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap;justify-content:center;width:96%}
button{border:1px solid var(--line);background:rgba(7,16,22,.92);color:#eafaff;border-radius:11px;padding:9px 11px;font-size:12px;cursor:pointer}
button:active{transform:scale(.97)}button.primary{background:#0b2832}
#ai{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,88vw);display:none;pointer-events:auto}
input{width:100%;background:#03070a;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}
.row{display:flex;gap:7px;margin-top:7px}.row button{flex:1}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(5,12,17,.95);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:12px;display:none}
@media(max-width:700px){
 .left{width:190px}.route{width:175px;height:125px;top:72px}.card{padding:7px}.small{font-size:9px}.value{font-size:11px}
 .logo{font-size:15px}.status{font-size:10px;padding:5px 8px}
 button{font-size:10px;padding:7px 8px;border-radius:9px}
 #objectPanel{bottom:92px}
}
</style>
</head>
<body>
<div id="app">
<video id="camera" autoplay playsinline muted></video>
<div class="hud">
  <div class="top">
    <div class="logo">BORZ</div>
    <div class="status" id="systemStatus">SYSTEM ONLINE · 100%</div>
  </div>

  <div class="left">
    <div class="card"><div class="small">ИИ-АССИСТЕНТ</div><div class="value" id="aiStatus">Готов помочь</div></div>
    <div class="card"><div class="small">РАСПОЗНАВАНИЕ</div><div class="value" id="recognition">Ожидание объекта</div></div>
    <div class="card"><div class="small">3D МОДЕЛЬ</div><div class="value" id="modelStatus">Не выбрана</div></div>
  </div>

  <div class="route">
    <div class="grid"></div><div class="routeLine"></div><div class="arrow">➤</div>
    <div style="position:absolute;left:10px;bottom:9px;font-size:10px">НАВИГАЦИЯ · 300 м</div>
  </div>

  <div id="objectPanel" class="card">
    <div id="objectName">BORZ VISION</div>
    <div class="badge" id="objectInfo">Камера готова · выбери объект или команду</div>
  </div>

  <div id="ai" class="card">
    <div class="small">BORZ AI</div>
    <div style="margin-top:7px">Локальный интерфейс помощника</div>
    <input id="aiInput" placeholder="Например: покажи 3D модель человека">
    <div class="row"><button onclick="askAI()">Выполнить</button><button onclick="closeAI()">Закрыть</button></div>
  </div>

  <div id="toast"></div>

  <div class="controls">
    <button onclick="startCamera()">📷 Камера</button>
    <button onclick="scanObject()">◉ Сканировать</button>
    <button onclick="show3D()">◇ 3D</button>
    <button onclick="openAI()">AI</button>
    <button onclick="voice()">🎙 Голос</button>
    <button onclick="navigate()">➤ Навигация</button>
  </div>
</div>
</div>

<script>
let stream=null;
const $=id=>document.getElementById(id);
const objects=["Человек","Автомобиль","ПК","Ноутбук","Телефон","Бутылка","Стул","Стол"];

function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").style.display="none",2200)}
async function startCamera(){
 try{
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
   $("camera").srcObject=stream;$("camera").style.display="block";
   toast("Задняя камера BORZ включена");
 }catch(e){toast("Камера недоступна: "+e.name)}
}
function scanObject(){
 const o=objects[Math.floor(Math.random()*objects.length)];
 $("recognition").textContent=o+" · обнаружен";
 $("modelStatus").textContent="Модель: "+o;
 $("objectName").textContent=o.toUpperCase();
 $("objectInfo").textContent="Объект выбран · можно открыть 3D";
 toast("Распознан объект: "+o);
}
function show3D(){
 const o=$("recognition").textContent.split(" ·")[0];
 $("modelStatus").textContent="3D: "+o;
 $("objectName").textContent="3D · "+o.toUpperCase();
 $("objectInfo").textContent="3D-предпросмотр активирован";
 toast("Открыта 3D-сцена: "+o);
}
function navigate(){toast("Навигация: маршрут построен · 300 м")}
function openAI(){$("ai").style.display="block";$("aiInput").focus()}
function closeAI(){$("ai").style.display="none"}
function askAI(){
 const q=$("aiInput").value.trim();
 if(!q)return;
 $("aiStatus").textContent="Выполняю: "+q;
 const l=q.toLowerCase();
 if(l.includes("3d"))show3D();
 else if(l.includes("камер"))startCamera();
 else if(l.includes("скан")||l.includes("распозн"))scanObject();
 else if(l.includes("навига")||l.includes("маршрут"))navigate();
 else toast("Команда принята. Для этой функции нужен подключённый AI backend.");
}
function voice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast("Распознавание голоса не поддерживается");return}
 const r=new SR();r.lang="ru-RU";r.interimResults=false;r.start();
 $("aiStatus").textContent="Слушаю...";
 r.onresult=e=>{ $("aiInput").value=e.results[0][0].transcript; askAI(); };
 r.onerror=()=>toast("Не удалось распознать голос");
}
</script>
</body>
</html>
