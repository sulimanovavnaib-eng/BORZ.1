<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020509">
<title>BORZ // ИИ HUD v4</title>
<style>
:root{--c:#8eeaff;--line:rgba(142,234,255,.28);--bg:#020509;--glass:rgba(1,10,16,.58)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--c)}
button{font:inherit}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#020509;z-index:0}
#camera.off{display:none}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 22%,transparent 72%,rgba(0,0,0,.42))}
#scan{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.025;background:repeating-linear-gradient(0deg,transparent 0 5px,#fff 6px)}
#boxes{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:900;letter-spacing:.32em;text-shadow:0 0 16px #35d8ff}
.status{font-size:8px;letter-spacing:.15em;border:1px solid var(--line);padding:7px 10px;border-radius:20px;background:var(--glass);backdrop-filter:blur(10px)}
.controls{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;pointer-events:auto}
.btn{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:rgba(0,9,14,.55);color:var(--c);font-size:8px;font-weight:900;backdrop-filter:blur(10px)}
.btn.on{background:rgba(53,216,255,.18);border-color:rgba(142,234,255,.8)}
.btn:active{transform:scale(.94)}
/* ЧИСТАЯ ОБЛАСТЬ ОБЗОРА: центр почти полностью свободен */
#reticle{position:absolute;left:50%;top:50%;width:112px;height:112px;transform:translate(-50%,-50%);border:1px solid rgba(142,234,255,.22);border-radius:50%}
#reticle:before,#reticle:after{content:"";position:absolute;background:var(--c)}
#reticle:before{width:1px;height:18px;left:50%;top:-9px}#reticle:after{height:1px;width:18px;top:50%;left:-9px}
.dot{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:var(--c);transform:translate(-50%,-50%);box-shadow:0 0 12px var(--c)}
#objectPanel{position:absolute;left:14px;right:65px;bottom:max(68px,calc(env(safe-area-inset-bottom) + 48px));display:flex;flex-wrap:wrap;gap:5px;pointer-events:auto}
.objChip{border:1px solid var(--line);background:var(--glass);color:var(--c);padding:6px 8px;border-radius:9px;font-size:9px;backdrop-filter:blur(8px)}
.bottom{position:absolute;left:16px;right:16px;bottom:max(13px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none}
.metric{min-width:60px}.label{font-size:7px;letter-spacing:.18em;color:rgba(180,245,255,.48);margin-bottom:2px}.value{font-size:11px;font-weight:700}.right{text-align:right}
#toast{position:absolute;left:50%;top:72px;transform:translateX(-50%);font-size:9px;letter-spacing:.08em;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:rgba(0,10,16,.75);backdrop-filter:blur(10px);opacity:0;transition:.2s;white-space:nowrap}
#toast.show{opacity:1}
#info{position:fixed;left:12px;right:12px;bottom:max(68px,calc(env(safe-area-inset-bottom) + 50px));z-index:8;display:none;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(2,10,16,.92);backdrop-filter:blur(16px);pointer-events:auto}
#info h3{margin:0 0 4px;font-size:16px}#info p{margin:0;color:rgba(220,250,255,.7);font-size:11px;line-height:1.4}
.infoBtns{display:flex;gap:6px;margin-top:10px}.action{flex:1;border:1px solid var(--line);background:rgba(53,216,255,.1);color:var(--c);padding:9px 5px;border-radius:9px;font-size:9px;font-weight:800}
#permission,#boot{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.84);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:25px}
.card{max-width:320px;text-align:center;border:1px solid var(--line);background:rgba(3,12,18,.94);border-radius:20px;padding:24px}.card h2{margin:0 0 8px}.card p{color:rgba(210,250,255,.67);font-size:12px;line-height:1.5}.primary{border:0;border-radius:11px;padding:12px 17px;background:var(--c);color:#001018;font-weight:900}
#boot{flex-direction:column;gap:13px;background:#020509}.bootLogo{font-size:40px;font-weight:900;letter-spacing:.3em}.bar{width:170px;height:2px;background:rgba(142,234,255,.15);overflow:hidden}.bar i{display:block;width:40%;height:100%;background:var(--c);animation:load 1.1s infinite}@keyframes load{to{transform:translateX(450%)}}
@media(max-width:430px){.logo{font-size:18px}.btn{width:41px;height:41px}}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="boxes"></canvas>
<div id="shade"></div><div id="scan"></div>

<div id="hud">
<header class="top"><div class="logo">BORZ</div><div class="status" id="state">ОЖИДАНИЕ</div></header>
<div id="toast"></div>
<div id="reticle"><div class="dot"></div></div>

<div class="controls">
<button class="btn" id="cam">КАМЕРА</button>
<button class="btn" id="ai">AI</button>
<button class="btn" id="web">ПОИСК</button>
<button class="btn" id="gps">ГЕО</button>
<button class="btn" id="voice">ГОЛОС</button>
</div>

<div id="objectPanel"></div>
<footer class="bottom">
<div class="metric"><div class="label">СКОРОСТЬ</div><div class="value" id="speed">— km/h</div></div>
<div class="metric"><div class="label">ОБЪЕКТ</div><div class="value" id="target">НЕТ</div></div>
<div class="metric right"><div class="label">ИИ BORZ</div><div class="value" id="sys">ГОТОВ</div></div>
</footer>
</div>

<div id="info">
<h3 id="infoTitle">BORZ</h3><p id="infoText">Выберите объект для подробной информации.</p>
<div class="infoBtns">
<button class="action" id="searchBtn">ПОИСК ПОИСК</button>
<button class="action" id="wikiBtn">ВИКИПЕДИЯ</button>
<button class="action" id="closeInfo">ЗАКРЫТЬ</button>
</div>
</div>

<div id="permission"><div class="card">
<h2>BORZ КАМЕРАERA</h2><p>Камера нужна для HUD и распознавания объектов. Нажмите кнопку и разрешите доступ Safari.</p>
<button class="primary" id="start">ЗАПУСТИТЬ BORZ</button>
</div></div>

<div id="boot"><div class="bootLogo">BORZ</div><div class="bar"><i></i></div><div style="font-size:9px;letter-spacing:.2em;color:rgba(180,245,255,.55)">ЗАПУСК СИСТЕМЫ ИИ</div></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const $=id=>document.getElementById(id),video=$('camera'),canvas=$('boxes'),ctx=canvas.getContext('2d');
let stream=null,model=null,aiOn=false,detecting=false,last=[],selected=null,gpsWatch=null;

const RU={person:'человек',bicycle:'велосипед',car:'автомобиль',motorcycle:'мотоцикл',airplane:'самолёт',bus:'автобус',train:'поезд',truck:'грузовик',boat:'лодка',traffic:'светофор',bird:'птица',cat:'кошка',dog:'собака',horse:'лошадь',sheep:'овца',cow:'корова',elephant:'слон',bear:'медведь',zebra:'зебра',giraffe:'жираф',backpack:'рюкзак',umbrella:'зонт',handbag:'сумка',suitcase:'чемодан',bottle:'бутылка',cup:'чашка',fork:'вилка',knife:'нож',spoon:'ложка',bowl:'миска',banana:'банан',apple:'яблоко',pizza:'пицца',cake:'торт',chair:'стул',couch:'диван',bed:'кровать',tv:'телевизор',laptop:'ноутбук',mouse:'мышь',keyboard:'клавиатура',cell_phone:'телефон',book:'книга',clock:'часы',scissors:'ножницы',toothbrush:'зубная щётка'};

function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1700)}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();

async function camera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;video.classList.remove('off');$('cam').classList.add('on');$('state').textContent='КАМЕРА ВКЛ.';toast('BORZ КАМЕРА ВКЛ.');
 }catch(e){toast('НЕТ ДОСТУПА К КАМЕРЕ')}
}
function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.classList.add('off');$('cam').classList.remove('on');$('state').textContent='ОЖИДАНИЕ'}

async function startAI(){
 if(!stream){toast('СНАЧАЛА ВКЛЮЧИ КАМЕРУ');return}
 if(!model){$('sys').textContent='ЗАГРУЗКА';toast('ЗАГРУЗКА ИИ BORZ');try{model=await cocoSsd.load();}catch(e){toast('ОШИБКА МОДЕЛИ ИИ');$('sys').textContent='ОШИБКА';return}}
 aiOn=!aiOn;$('ai').classList.toggle('on',aiOn);$('sys').textContent=aiOn?'СКАНИРОВАНИЕ':'ГОТОВ';toast(aiOn?'РАСПОЗНАВАНИЕ ВКЛ.':'РАСПОЗНАВАНИЕ ВЫКЛ.');
 if(aiOn&&!detecting){detecting=true;detectLoop()}
}
async function detectLoop(){
 if(!aiOn||!model||video.readyState<2){detecting=false;return}
 try{last=await model.detect(video);draw(last);renderChips(last)}catch(e){}
 if(aiOn){requestAnimationFrame(detectLoop)}else{ctx.clearRect(0,0,innerWidth,innerHeight);detecting=false}
}
function draw(pred){
 ctx.clearRect(0,0,innerWidth,innerHeight);
 const sx=innerWidth/video.videoWidth||1,sy=innerHeight/video.videoHeight||1;
 pred.filter(p=>p.score>.52).forEach((p,i)=>{
  const [x,y,w,h]=p.bbox;const X=x*sx,Y=y*sy,W=w*sx,H=h*sy;
  ctx.strokeStyle='rgba(142,234,255,.82)';ctx.lineWidth=1.4;ctx.strokeRect(X,Y,W,H);
  ctx.fillStyle='rgba(0,10,16,.72)';const label=(RU[p.class]||p.class)+' '+Math.round(p.score*100)+'%';
  ctx.fillRect(X,Y-19,Math.min(150,ctx.measureText(label).width+16),19);
  ctx.fillStyle='#8eeaff';ctx.font='10px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(label,X+7,Y-6);
 });
}
function renderChips(pred){
 const panel=$('objectPanel');panel.innerHTML='';
 const seen=new Set();
 pred.filter(p=>p.score>.52).forEach(p=>{
  const name=RU[p.class]||p.class;if(seen.has(name))return;seen.add(name);
  const b=document.createElement('button');b.className='objChip';b.textContent=name+' '+Math.round(p.score*100)+'%';
  b.onclick=()=>showInfo(name,p.class);panel.appendChild(b);
 });
}
function showInfo(name,key){
 selected={name,key};$('target').textContent=name.toUpperCase();$('infoTitle').textContent='BORZ // '+name.toUpperCase();
 $('infoText').textContent='Объект распознан камерой. Можно выполнить поиск в интернете или открыть Википедию.';
 $('info').style.display='block';
}
$('closeInfo').onclick=()=>{$('info').style.display='none'}
function search(q){window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener')}
$('searchBtn').onclick=()=>selected&&search(selected.name+' что это');
$('wikiBtn').onclick=()=>selected&&window.open('https://ru.wikipedia.org/wiki/'+encodeURIComponent(selected.name),'_blank','noopener');
$('web').onclick=()=>{const q=prompt('Что найти в интернете?');if(q)search(q)}
$('cam').onclick=()=>stream?stopCamera():camera();
$('ai').onclick=startAI;

$('gps').onclick=()=>{
 if(!navigator.geolocation){toast('ГЕО НЕ ДОСТУПЕН');return}
 if(gpsWatch){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;$('gps').classList.remove('on');toast('ГЕО OFF');return}
 gpsWatch=navigator.geolocation.watchPosition(p=>{
  const s=p.coords.speed; $('speed').textContent=s!=null?Math.round(s*3.6)+' km/h':'— km/h';
 },()=>toast('ГЕО ACCESS DENIED'),{enableHighAccuracy:true,maximumAge:2000});
 $('gps').classList.add('on');toast('ГЕО ONLINE');
};

$('voice').onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('ГОЛОС НЕ ПОДДЕРЖИВАЕТСЯ');return}
 const r=new SR();r.lang='ru-RU';r.interimResults=false;r.onstart=()=>{$('voice').classList.add('on');toast('BORZ СЛУШАЕТ')};
 r.onend=()=>$('voice').classList.remove('on');
 r.onresult=e=>{
    const q=e.results[0][0].transcript;
    toast('BORZ: '+q);
    speakRU('Команда получена.');
    if(/найди|поиск|гугл/i.test(q))
        search(q.replace(/найди|поиск|гугл/ig,'').trim())
};
 r.start();
};

$('start').onclick=async()=>{$('permission').style.display='none';await camera()};
setTimeout(()=>{$('boot').style.display='none'},1200);
</script>
</body></html>
