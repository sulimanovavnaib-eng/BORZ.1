<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BORZ Vision</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<style>
:root{
 --cyan:#69eaff;
 --bg:#03070b;
 --panel:rgba(3,10,15,.84);
 --line:rgba(105,234,255,.42)
}

*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#000;
 color:#eafaff;
 font-family:Arial,sans-serif
}

button,input{font:inherit}

#app{
 position:relative;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#05090d
}

#camera{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 display:none;
 opacity:.48
}

#camera.on{display:block}

.hud{
 position:absolute;
 inset:0;
 pointer-events:none
}

.top{
 position:absolute;
 top:max(12px,env(safe-area-inset-top));
 left:18px;
 right:18px;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.logo{
 font-size:19px;
 font-weight:800;
 letter-spacing:5px
}

.status{
 font-size:11px;
 padding:8px 11px;
 border:1px solid var(--line);
 border-radius:18px;
 background:var(--panel);
 backdrop-filter:blur(8px)
}

.dot{
 display:inline-block;
 width:7px;
 height:7px;
 border-radius:50%;
 background:#45ef70;
 box-shadow:0 0 9px #45ef70;
 margin-right:6px
}

.left{
 position:absolute;
 left:18px;
 top:72px;
 width:min(345px,46vw);
 display:grid;
 gap:9px
}

.card{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:15px;
 padding:11px;
 backdrop-filter:blur(10px)
}

.small{
 font-size:10px;
 color:#9bb8c1
}

.value{
 font-size:14px;
 margin-top:5px;
 line-height:1.3
}

.route{
 position:absolute;
 right:18px;
 top:72px;
 width:min(350px,44vw);
 height:190px;
 border:1px solid var(--line);
 border-radius:15px;
 overflow:hidden;
 background:linear-gradient(
  135deg,
  rgba(9,30,38,.93),
  rgba(3,8,12,.92)
 )
}

.grid{
 position:absolute;
 inset:0;
 background-image:
 linear-gradient(rgba(105,234,255,.08) 1px,transparent 1px),
 linear-gradient(90deg,rgba(105,234,255,.08) 1px,transparent 1px);
 background-size:24px 24px;
 transform:perspective(350px) rotateX(55deg) scale(1.6);
 transform-origin:center bottom
}

.routeLine{
 position:absolute;
 width:70%;
 height:4px;
 left:15%;
 top:57%;
 background:var(--cyan);
 transform:rotate(-23deg);
 box-shadow:0 0 15px var(--cyan);
 border-radius:8px
}

.arrow{
 position:absolute;
 right:15%;
 top:31%;
 font-size:32px;
 color:var(--cyan)
}

.routeText{
 position:absolute;
 left:10px;
 bottom:9px;
 font-size:10px
}

#targetBox{
 position:absolute;
 display:none;
 border:2px solid var(--cyan);
 border-radius:10px;
 box-shadow:0 0 18px rgba(105,234,255,.4);
 pointer-events:none;
 z-index:5
}

#targetLabel{
 position:absolute;
 left:-2px;
 top:-25px;
 padding:4px 7px;
 background:rgba(3,10,15,.92);
 border:1px solid var(--line);
 border-radius:7px;
 font-size:10px;
 white-space:nowrap
}

#objectPanel{
 position:absolute;
 left:50%;
 bottom:88px;
 transform:translateX(-50%);
 width:min(470px,82vw);
 text-align:center
}

#objectName{
 font-size:18px;
 font-weight:800
}

.badge{
 display:inline-block;
 margin-top:7px;
 padding:6px 10px;
 border-radius:14px;
 border:1px solid var(--line);
 font-size:11px
}

#threePanel{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:min(540px,88vw);
 height:min(430px,58vh);
 display:none;
 background:rgba(2,7,11,.94);
 border:1px solid var(--line);
 border-radius:18px;
 overflow:hidden;
 pointer-events:auto;
 z-index:20
}

#threeCanvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%
}

.threeHead{
 position:absolute;
 z-index:2;
 left:12px;
 right:12px;
 top:10px;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.threeTitle{
 font-size:12px;
 font-weight:800
}

#close3d{
 border:1px solid var(--line);
 background:rgba(3,10,15,.85);
 color:white;
 border-radius:10px;
 padding:5px 9px
}

#aiPanel{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:min(520px,88vw);
 display:none;
 pointer-events:auto;
 z-index:20
}

#aiInput{
 width:100%;
 margin-top:8px;
 padding:12px;
 border-radius:11px;
 border:1px solid var(--line);
 background:#02070a;
 color:#fff;
 outline:none
}

.row{
 display:flex;
 gap:7px;
 margin-top:8px
}

.row button{flex:1}

button{
 border:1px solid var(--line);
 background:rgba(5,15,21,.94);
 color:#eafaff;
 border-radius:11px;
 padding:9px 11px;
 font-size:11px;
 cursor:pointer
}

button:active{
 transform:scale(.97)
}

button.active{
 background:rgba(21,83,98,.8);
 box-shadow:0 0 12px rgba(105,234,255,.16)
}

#toast{
 position:absolute;
 z-index:30;
 left:50%;
 top:18%;
 transform:translateX(-50%);
 background:rgba(3,10,15,.96);
 border:1px solid var(--line);
 border-radius:12px;
 padding:9px 13px;
 font-size:12px;
 display:none;
 max-width:88vw;
 text-align:center
}

.controls{
 position:absolute;
 z-index:10;
 bottom:max(12px,env(safe-area-inset-bottom));
 left:50%;
 transform:translateX(-50%);
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 justify-content:center;
 width:96%;
 pointer-events:auto
}

#loading{
 position:absolute;
 z-index:25;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:min(430px,86vw);
 display:none;
 text-align:center
}

#loadingBar{
 height:4px;
 background:#12303a;
 border-radius:5px;
 overflow:hidden;
 margin-top:9px
}

#loadingBar i{
 display:block;
 height:100%;
 width:0;
 background:var(--cyan)
}

@media(max-width:700px){

 .left{
  width:190px;
  top:68px;
  left:10px
 }

 .route{
  width:180px;
  height:130px;
  right:10px;
  top:68px
 }

 .card{padding:8px}

 .small{font-size:9px}

 .value{font-size:11px}

 .logo{font-size:15px}

 .status{
  font-size:9px;
  padding:6px 8px
 }

 button{
  font-size:10px;
  padding:8px 9px
 }

 #objectPanel{bottom:92px}

 .controls{gap:5px}
}
</style>
</head>

<body>

<div id="app">

<video id="camera" autoplay playsinline muted></video>

<div class="logo">BORZ</div>

<script>

"use strict";

const $ = id => document.getElementById(id);

let stream = null;
let detector = null;
let detecting = false;
let lastDetection = null;
let recognition = null;
let currentObject = "человек";


const RU = {

person:"человек",
bicycle:"велосипед",
car:"автомобиль",
motorcycle:"мотоцикл",
airplane:"самолёт",
bus:"автобус",
train:"поезд",
truck:"грузовик",
boat:"лодка",
traffic_light:"светофор",
bird:"птица",
cat:"кошка",
dog:"собака",
horse:"лошадь",
sheep:"овца",
cow:"корова",
elephant:"слон",
bear:"медведь",
zebra:"зебра",
giraffe:"жираф",
backpack:"рюкзак",
umbrella:"зонт",
handbag:"сумка",
suitcase:"чемодан",
bottle:"бутылка",
cup:"чашка",
fork:"вилка",
knife:"нож",
spoon:"ложка",
bowl:"миска",
banana:"банан",
apple:"яблоко",
pizza:"пицца",
cake:"торт",
chair:"стул",
couch:"диван",
bed:"кровать",
dining_table:"стол",
tv:"телевизор",
laptop:"ноутбук",
mouse:"мышь",
keyboard:"клавиатура",
cell_phone:"телефон",
book:"книга",
clock:"часы",
scissors:"ножницы",
toothbrush:"зубная щётка"

};


function toast(text){

 $("toast").textContent=text;

 $("toast").style.display="block";

 clearTimeout(window.__toastTimer);

 window.__toastTimer=setTimeout(()=>{
  $("toast").style.display="none";
 },2600);

}


function speak(text){

 if(!("speechSynthesis" in window)) return;

 speechSynthesis.cancel();

 const u=new SpeechSynthesisUtterance(text);

 u.lang="ru-RU";
 u.rate=.95;

 speechSynthesis.speak(u);

}


function setStatus(text){

 $("aiStatus").textContent=text;

}


function updateObject(name,confidence){

 currentObject=name || "объект";

 $("recognition").textContent=
 confidence
 ? `${name} · обнаружен · ${Math.round(confidence*100)}%`
 : `${name} · выбран`;

 $("objectName").textContent=name.toUpperCase();

 $("objectInfo").textContent=
 "Объект выбран · можно открыть 3D";

 $("modelStatus").textContent=
 "Готова 3D-модель: "+name;

}


/* КАМЕРА */

async function startCamera(){

 if(
 !navigator.mediaDevices ||
 !navigator.mediaDevices.getUserMedia
 ){

  toast(
   "Камера требует HTTPS. GitHub Pages должен быть открыт через https://"
  );

  return false;

 }

 try{

  if(stream){

   $("camera").classList.add("on");

   setStatus("Камера уже подключена.");

   return true;

  }

  setStatus("Запрашиваю доступ к камере…");

  stream=await navigator.mediaDevices.getUserMedia({

   video:{
    facingMode:{ideal:"environment"},
    width:{ideal:1280},
    height:{ideal:720}
   },

   audio:false

  });


  $("camera").srcObject=stream;

  $("camera").classList.add("on");

  $("recognition").textContent=
  "Камера онлайн · готова к сканированию";

  $("objectInfo").textContent=
  "Нажми «Сканировать»";

  setStatus("Камера ONLINE · BORZ готов");

  toast("Задняя камера BORZ включена");

  return true;

 }catch(e){

  console.error(e);

  setStatus("Нет доступа к камере");

  toast(
   "Камера: "+(e.name || "доступ запрещён")
  );

  return false;

 }

}


/* ЗАГРУЗКА ИИ */

async function loadDetector(){

 if(detector) return true;

 $("loading").style.display="block";

 $("loadingText").textContent=
 "Загрузка TensorFlow + COCO-SSD…";

 $("loadingBar").firstElementChild.style.width="25%";


 try{

  await tf.ready();

  $("loadingBar").firstElementChild.style.width="55%";

  detector=
  await cocoSsd.load({
   base:"lite_mobilenet_v2"
  });

  $("loadingBar").firstElementChild.style.width="100%";

  $("loadingText").textContent=
  "Модель готова";

  setTimeout(()=>{
   $("loading").style.display="none";
  },300);

  return true;

 }catch(e){

  console.error(e);

  $("loading").style.display="none";

  toast(
   "Не удалось загрузить модель распознавания"
  );

  return false;

 }

}


/* РАСПОЗНАВАНИЕ */

async function scanObject(){

 if(!stream){

  const ok=await startCamera();

  if(!ok) return;

 }


 if(!detector){

  const ok=await loadDetector();

  if(!ok) return;

 }


 if(detecting) return;

 detecting=true;

 setStatus(
  "BORZ · анализ изображения…"
 );


 try{

  await new Promise(resolve=>{

   if($("camera").readyState>=2){

    resolve();

   }else{

    $("camera").addEventListener(
     "loadeddata",
     resolve,
     {once:true}
    );

   }

  });


  const predictions=
  await detector.detect(
   $("camera"),
   8,
   .45
  );


  if(!predictions.length){

   $("targetBox").style.display="none";

   $("recognition").textContent=
   "Объект не найден";

   $("objectInfo").textContent=
   "Направь камеру на человека или предмет";

   setStatus(
    "BORZ · сканирование завершено"
   );

   toast("Объект не найден");

   return;

  }


  predictions.sort(
   (a,b)=>b.score-a.score
  );


  const p=predictions[0];

  lastDetection=p;


  const name=
  RU[p.class] || p.class;


  updateObject(
   name,
   p.score
  );


  const video=$("camera");

  const [x,y,w,h]=p.bbox;

  const vw=
  video.videoWidth || 1280;

  const vh=
  video.videoHeight || 720;

  const sx=
  innerWidth/vw;

  const sy=
  innerHeight/vh;


  const box=$("targetBox");

  box.style.display="block";

  box.style.left=
  Math.max(0,x*sx)+"px";

  box.style.top=
  Math.max(0,y*sy)+"px";

  box.style.width=
  Math.max(20,w*sx)+"px";

  box.style.height=
  Math.max(20,h*sy)+"px";


  $("targetLabel").textContent=
  `${name.toUpperCase()} · ${Math.round(p.score*100)}%`;


  setStatus(
   "BORZ · объект распознан"
  );

  toast(
   `Распознано: ${name}`
  );


 }catch(e){

  console.error(e);

  toast("Ошибка сканирования");

  setStatus(
   "Ошибка компьютерного зрения"
  );

 }finally{

  detecting=false;

 }

}


/* 3D */

function makeMaterial(){

 return new THREE.MeshStandardMaterial({

  color:0x58e5ff,

  metalness:.35,

  roughness:.35

 });

}


function make3DObject(name){

 const g=new THREE.Group();

 const m=makeMaterial();

 const lower=name.toLowerCase();


 if(lower.includes("человек")){

  const head=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .38,20,16
   ),
   m
  );

  head.position.y=2.35;

  g.add(head);


  const body=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .48,.58,1.35,16
   ),
   m
  );

  body.position.y=1.35;

  g.add(body);


  const arm1=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .12,.15,1.15,12
   ),
   m
  );

  arm1.rotation.z=-.18;

  arm1.position.set(
   -.68,1.38,0
  );

  g.add(arm1);


  const arm2=arm1.clone();

  arm2.rotation.z=.18;

  arm2.position.x=.68;

  g.add(arm2);


  const leg1=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .14,.17,1.35,12
   ),
   m
  );

  leg1.position.set(
   -.25,.2,0
  );

  g.add(leg1);


  const leg2=leg1.clone();

  leg2.position.x=.25;

  g.add(leg2);

 }


 else if(lower.includes("бутыл")){

  const body=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .45,.52,1.8,20
   ),
   m
  );

  body.position.y=.9;

  g.add(body);


  const neck=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .22,.27,.45,20
   ),
   m
  );

  neck.position.y=2.02;

  g.add(neck);


  const cap=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .24,.24,.16,20
   ),
   m
  );

  cap.position.y=2.32;

  g.add(cap);

 }


 else if(lower.includes("стул")){

  const seat=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    1.7,.18,1.7
   ),
   m
  );

  seat.position.y=1.25;

  g.add(seat);


  for(
   const x of [-.65,.65]
  )
  for(
   const z of [-.65,.65]
  ){

   const leg=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     .16,1.25,.16
    ),
    m
   );

   leg.position.set(
    x,.62,z
   );

   g.add(leg);

  }


  const back=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    1.7,1.7,.16
   ),
   m
  );

  back.position.set(
   0,2.05,-.68
  );

  g.add(back);

 }


 else if(
 lower.includes("ноутбук") ||
 lower.includes("компьютер") ||
 lower.includes("пк")
 ){

  const screen=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    2.7,1.7,.12
   ),
   m
  );

  screen.position.y=1.35;

  g.add(screen);


  const base=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    2.9,.12,2
   ),
   m
  );

  base.position.y=.48;

  g.add(base);

 }


 else if(
 lower.includes("автомоб") ||
 lower.includes("машин")
 ){

  const body=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    3,.75,1.45
   ),
   m
  );

  body.position.y=.65;

  g.add(body);


  const cabin=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    1.65,.72,1.25
   ),
   m
  );

  cabin.position.set(
   .15,1.28,0
  );

  g.add(cabin);

 }


 else if(
 lower.includes("телефон")
 ){

  const phone=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    1.15,.12,2.15
   ),
   m
  );

  phone.position.y=1;

  g.add(phone);

 }


 else{

  const box=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    1.8,1.8,1.8
   ),
   m
  );

  g.add(box);

 }


 return g;

}


let threeState=null;


function show3D(name=currentObject){

 $("threePanel").style.display="block";

 $("threeTitle").textContent=
 "BORZ · 3D · "+name.toUpperCase();

 $("modelStatus").textContent=
 "3D: "+name;

 $("objectName").textContent=
 "3D · "+name.toUpperCase();

 $("objectInfo").textContent=
 "3D-предпросмотр активирован";

 initThree(name);

 toast(
  "Открыта 3D-сцена: "+name
 );

}


function initThree(name){

 const canvas=$("threeCanvas");

 const scene=
 new THREE.Scene();

 scene.background=
 new THREE.Color(0x02070b);


 const camera=
 new THREE.PerspectiveCamera(
  45,1,.1,100
 );


 camera.position.set(
  4,3.2,6
 );


 const renderer=
 new THREE.WebGLRenderer({
  canvas,
  antialias:true
 });


 renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
 );


 scene.add(
  new THREE.AmbientLight(
   0x8edfff,.75
  )
 );


 const light=
 new THREE.DirectionalLight(
  0xffffff,1.5
 );

 light.position.set(4,6,5);

 scene.add(light);


 const grid=
 new THREE.GridHelper(
  8,16,
  0x164b59,
  0x0b2931
 );

 grid.position.y=-1.05;

 scene.add(grid);


 const object=
 make3DObject(name);

 object.position.y=-1;

 scene.add(object);


 function resize(){

  const w=
  canvas.clientWidth || 400;

  const h=
  canvas.clientHeight || 300;

  renderer.setSize(
   w,h,false
  );

  camera.aspect=w/h;

  camera.updateProjectionMatrix();

 }


 resize();


 let dragging=false;

 let lastX=0;

 let lastY=0;


 canvas.onpointerdown=e=>{

  dragging=true;

  lastX=e.clientX;

  lastY=e.clientY;

 };


 canvas.onpointermove=e=>{

  if(!dragging) return;

  object.rotation.y+=
  (e.clientX-lastX)*.012;

  object.rotation.x+=
  (e.clientY-lastY)*.008;

  lastX=e.clientX;

  lastY=e.clientY;

 };


 canvas.onpointerup=
 canvas.onpointercancel=()=>{
  dragging=false;
 };


 threeState={
  scene,
  camera,
  renderer,
  object
 };


 function animate(){

  if(
   $("threePanel").style.display==="none"
  ) return;

  if(!dragging){

   object.rotation.y+=.006;

  }

  renderer.render(
   scene,
   camera
  );

  requestAnimationFrame(
   animate
  );

 }

 animate();

}


$("close3d").onclick=()=>{

 $("threePanel").style.display="none";

};


$("threeBtn").onclick=()=>{

 show3D(currentObject);

};


/* AI */

function openAI(){

 $("aiPanel").style.display="block";

 $("aiInput").focus();

}


function closeAI(){

 $("aiPanel").style.display="none";

}


function runCommand(q){

 const l=q.toLowerCase().trim();

 if(!l)return;


 $("aiStatus").textContent=
 "Выполняю: "+q;


 if(
  l.includes("3d") ||
  l.includes("трехмер")
 ){

  let name=currentObject;


  if(l.includes("человек"))
  name="человек";

  else if(l.includes("бутыл"))
  name="бутылка";

  else if(l.includes("стул"))
  name="стул";

  else if(
   l.includes("автомоб") ||
   l.includes("машин")
  )
  name="автомобиль";

  else if(l.includes("ноутбук"))
  name="ноутбук";

  else if(l.includes("телефон"))
  name="телефон";

  else if(
   l.includes("пк") ||
   l.includes("компьют")
  )
  name="ПК";


  show3D(name);

  speak(
   "Открываю 3D модель "+name
  );

  return;

 }


 if(l.includes("камер")){

  startCamera();

  return;

 }


 if(
  l.includes("скан") ||
  l.includes("распозн")
 ){

  scanObject();

  return;

 }


 if(
  l.includes("навига") ||
  l.includes("маршрут") ||
  l.includes("куда")
 ){

  navigate();

  return;

 }


 if(l.includes("поиск")){

  const q2=
  l.replace(
   /поиск|найди|найти/g,
   ""
  ).trim() || currentObject;


  window.open(
   "https://www.google.com/search?q="+
   encodeURIComponent(q2),
   "_blank"
  );

  return;

 }


 toast(
  "Команда пока не подключена"
 );

}


$("aiBtn").onclick=openAI;

$("closeAI").onclick=closeAI;

$("runAI").onclick=()=>{

 runCommand(
  $("aiInput").value
 );

};


$("aiInput").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter"){

   runCommand(
    $("aiInput").value
   );

  }

 }
);


/* ГОЛОС */

function voice(){

 const SR=
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;


 if(!SR){

  toast(
   "Голосовой ввод не поддерживается"
  );

  return;

 }


 recognition=
 new SR();


 recognition.lang="ru-RU";

 recognition.interimResults=false;

 recognition.continuous=false;


 recognition.onstart=()=>{

  $("voiceBtn").classList.add("active");

  setStatus(
   "BORZ · слушаю…"
  );

  $("aiStatus").textContent=
  "Слушаю команду…";

 };


 recognition.onresult=e=>{

  const text=
  e.results[0][0].transcript;

  $("aiStatus").textContent=
  "Вы: "+text;

  runCommand(text);

 };


 recognition.onerror=e=>{

  toast(
   "Ошибка голоса: "+e.error
  );

 };


 recognition.onend=()=>{

  $("voiceBtn")
  .classList.remove("active");

  setStatus(
   "BORZ · готов"
  );

 };


 try{

  recognition.start();

 }catch(e){}

}


/* НАВИГАЦИЯ */

function navigate(){

 if(!navigator.geolocation){

  window.open(
   "https://www.google.com/maps",
   "_blank"
  );

  return;

 }


 setStatus(
  "BORZ · определяю GPS…"
 );


 navigator.geolocation.getCurrentPosition(

  p=>{

   const lat=
   p.coords.latitude.toFixed(6);

   const lon=
   p.coords.longitude.toFixed(6);


   $("routeText").textContent=
   `GPS ${lat}, ${lon}`;


   setStatus(
    "BORZ · GPS ONLINE"
   );


   toast(
    "GPS получен"
   );


   window.open(
    `https://www.google.com/maps/dir/?api=1&origin=${lat},${lon}`,
    "_blank"
   );

  },

  ()=>{

   toast(
    "Разреши геолокацию для сайта"
   );

   setStatus(
    "GPS · нет доступа"
   );

  },

  {
   enableHighAccuracy:true,
   timeout:10000,
   maximumAge:5000
  }

 );

}


/* КНОПКИ */

$("cameraBtn").onclick=async()=>{

 const ok=
 await startCamera();

 if(ok && !detector){

  loadDetector();

 }

};


$("scanBtn").onclick=
scanObject;


$("threeBtn").onclick=()=>
show3D(currentObject);


$("aiBtn").onclick=
openAI;


$("voiceBtn").onclick=
voice;


$("navBtn").onclick=
navigate;


/* ЗАПУСК */

window.addEventListener(
 "load",
 ()=>{

  setStatus(
   "SYSTEM ONLINE · 100%"
  );

  setTimeout(
   ()=>{

    setStatus(
     "BORZ · готов"
    );

    $("aiStatus").textContent=
    "BORZ активирован. Я готов.";

   },
   700
  );

 }
);

</script>
