<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BORZ AI</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* Основной экран */
#hud {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* Верхняя панель */
#top {
    position: absolute;
    top: 20px;
    left: 30px;
    right: 30px;
    display: flex;
    justify-content: center;
    z-index: 10;
}

.logo {
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 8px;
    text-shadow:
        0 0 10px #00ffff,
        0 0 25px #00ffff;
}

/* Левая панель */
#leftPanel {
    position: absolute;
    top: 85px;
    left: 25px;
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 10;
}

.panel {
    padding: 12px 16px;
    border-left: 2px solid #00ffff;
    background: rgba(0, 20, 25, 0.45);
    backdrop-filter: blur(5px);
    box-shadow: 0 0 15px rgba(0,255,255,.12);
}

.title {
    font-size: 11px;
    color: #6fffff;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.value {
    margin-top: 5px;
    font-size: 17px;
}

/* Карта */
#mapContainer {
    position: absolute;
    top: 70px;
    right: 25px;
    width: 350px;
    height: 240px;
    border: 1px solid rgba(0,255,255,.7);
    background: rgba(0,0,0,.25);
    opacity: .82;
    box-shadow: 0 0 25px rgba(0,255,255,.18);
    overflow: hidden;
    pointer-events: auto;
}

#map {
    width: 100%;
    height: 100%;
    filter: brightness(.75) saturate(.7);
}

.mapLabel {
    position: absolute;
    top: 8px;
    left: 10px;
    z-index: 999;
    color: #00ffff;
    font-size: 11px;
    letter-spacing: 2px;
    background: rgba(0,0,0,.55);
    padding: 5px 8px;
}

/* Камера */
#cameraArea {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
}

#cameraText {
    color: rgba(255,255,255,.3);
    font-size: 13px;
    letter-spacing: 3px;
}

/* Нижняя панель */
#bottom {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 620px;
    max-width: 90%;
    padding: 15px 20px;
    text-align: center;
    background: rgba(0,15,20,.5);
    border: 1px solid rgba(0,255,255,.35);
    backdrop-filter: blur(5px);
    z-index: 10;
}

#status {
    color: #00ffff;
    font-size: 13px;
    margin-bottom: 8px;
}

#answer {
    font-size: 18px;
}

/* Кнопка */
#voiceButton {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 1px solid #00ffff;
    background: rgba(0,255,255,.08);
    color: #00ffff;
    font-size: 26px;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 0 20px rgba(0,255,255,.3);
}

#voiceButton.active {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 10px #00ffff;
    }
    50% {
        box-shadow: 0 0 35px #00ffff;
    }
    100% {
        box-shadow: 0 0 10px #00ffff;
    }
}

/* Прицел */
.crosshair {
    position: absolute;
    width: 70px;
    height: 70px;
    border: 1px solid rgba(0,255,255,.3);
    border-radius: 50%;
}

.crosshair::before,
.crosshair::after {
    content: "";
    position: absolute;
    background: rgba(0,255,255,.35);
}

.crosshair::before {
    width: 100%;
    height: 1px;
    top: 50%;
    left: 0;
}

.crosshair::after {
    height: 100%;
    width: 1px;
    left: 50%;
    top: 0;
}

/* Мобильный экран */
@media(max-width:700px) {

    #leftPanel {
        width: 190px;
        left: 12px;
        top: 70px;
    }

    .panel {
        padding: 8px 10px;
    }

    .value {
        font-size: 13px;
    }

    #mapContainer {
        width: 230px;
        height: 170px;
        right: 12px;
        top: 65px;
    }

    #bottom {
        bottom: 15px;
    }

    #voiceButton {
        right: 15px;
        bottom: 95px;
    }
}
</style>
</head>

<body>

<div id="hud">

    <div id="top">
        <div class="logo">BORZ</div>
    </div>

    <!-- ЛЕВАЯ СТОРОНА -->
    <div id="leftPanel">

        <div class="panel">
            <div class="title">Аккумулятор</div>
            <div class="value" id="battery">Определение...</div>
        </div>

        <div class="panel">
            <div class="title">Голосовой режим</div>
            <div class="value" id="voiceStatus">
                Ожидание
            </div>
        </div>

        <div class="panel">
            <div class="title">BORZ AI</div>
            <div class="value" id="aiStatus">
                Система готова
            </div>
        </div>

        <div class="panel">
            <div class="title">Распознавание объекта</div>
            <div class="value" id="object">
                Ожидание камеры
            </div>
        </div>

        <div class="panel">
            <div class="title">Высота объекта</div>
            <div class="value" id="height">
                —
            </div>
        </div>

        <div class="panel">
            <div class="title">Местоположение</div>
            <div class="value" id="location">
                Определение GPS...
            </div>
        </div>

    </div>

    <!-- ПРОЗРАЧНАЯ КАРТА -->
    <div id="mapContainer">
        <div class="mapLabel">BORZ NAVIGATION</div>
        <div id="map"></div>
    </div>

    <!-- МЕСТО ПОД КАМЕРУ -->
    <div id="cameraArea">
        <div class="crosshair"></div>
        <div id="cameraText">
            CAMERA / VIDEO INPUT
        </div>
    </div>

    <!-- ОТВЕТ BORZ -->
    <div id="bottom">

        <div id="status">
            BORZ • ГОТОВ К РАБОТЕ
        </div>

        <div id="answer">
            Система активна. Слушаю вас.
        </div>

    </div>

    <!-- ГОЛОС -->
    <button id="voiceButton">🎙</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================
   BORZ CORE
========================================= */

const answer = document.getElementById("answer");
const voiceButton = document.getElementById("voiceButton");
const voiceStatus = document.getElementById("voiceStatus");
const locationText = document.getElementById("location");
const batteryText = document.getElementById("battery");


/* =========================================
   АККУМУЛЯТОР
========================================= */

if ("getBattery" in navigator) {

    navigator.getBattery().then(battery => {

        function updateBattery() {

            const percent =
                Math.round(battery.level * 100);

            batteryText.textContent =
                percent + "%";

        }

        updateBattery();

        battery.addEventListener(
            "levelchange",
            updateBattery
        );

    });

} else {

    batteryText.textContent =
        "Недоступно";

}


/* =========================================
   КАРТА
========================================= */

const map = L.map("map", {
    zoomControl: false,
    attributionControl: false
}).setView([50.0, 11.5], 13);


/* Карта OpenStreetMap */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19
    }
).addTo(map);

let userMarker = null;


/* =========================================
   GPS
========================================= */

function locateUser() {

    if (!navigator.geolocation) {

        locationText.textContent =
            "GPS недоступен";

        return;
    }

    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            locationText.textContent =
                lat.toFixed(5) +
                ", " +
                lon.toFixed(5);

            if (userMarker) {
                userMarker.setLatLng([lat, lon]);
            } else {

                userMarker =
                    L.marker([lat, lon])
                    .addTo(map)
                    .bindPopup("BORZ — вы здесь");

            }

            map.setView(
                [lat, lon],
                16
            );

        },

        error => {

            locationText.textContent =
                "GPS недоступен";

        },

        {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000
        }
    );
}

locateUser();


/* =========================================
   ГОЛОСОВОЙ ДВИЖОК
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "ru-RU";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = () => {

        voiceStatus.textContent =
            "Слушаю...";

        voiceButton.classList.add("active");

    };


    recognition.onend = () => {

        voiceStatus.textContent =
            "Ожидание";

        voiceButton.classList.remove("active");

    };


    recognition.onresult = event => {

        const text =
            event.results[0][0].transcript
            .toLowerCase();

        answer.textContent =
            "Вы: " + text;

        processCommand(text);

    };

} else {

    voiceStatus.textContent =
        "Голос не поддерживается";

}


/* =========================================
   КНОПКА ГОЛОСА
========================================= */

voiceButton.onclick = () => {

    if (recognition) {

        try {

            recognition.start();

        } catch(e) {}

    }

};


/* =========================================
   BORZ COMMANDS
========================================= */

function processCommand(command) {

    if (
        command.includes("привет") ||
        command.includes("борз")
    ) {

        speak(
            "Здравствуйте. Борз готов к работе."
        );

        answer.textContent =
            "BORZ: Готов к работе.";

        return;
    }


    if (
        command.includes("где я") ||
        command.includes("местоположение")
    ) {

        locateUser();

        speak(
            "Определяю ваше местоположение."
        );

        answer.textContent =
            "BORZ: Определяю местоположение.";

        return;
    }


    if (
        command.includes("карта") ||
        command.includes("навигация")
    ) {

        speak(
            "Навигационная система активна."
        );

        answer.textContent =
            "BORZ: Навигация активна.";

        return;
    }


    if (
        command.includes("высота") ||
        command.includes("измерь объект")
    ) {

        answer.textContent =
            "BORZ: Ожидаю данные камеры для измерения.";

        speak(
            "Ожидаю данные камеры для измерения объекта."
        );

        return;
    }


    if (
        command.includes("объект") ||
        command.includes("что передо мной")
    ) {

        answer.textContent =
            "BORZ: Модуль распознавания объекта готов.";

        speak(
            "Модуль распознавания объекта готов."
        );

        return;
    }


    if (
        command.includes("поиск") ||
        command.includes("найди в интернете")
    ) {

        const query =
            command
            .replace("найди в интернете", "")
            .replace("поиск", "")
            .trim();

        if (query.length > 0) {

            window.open(
                "https://www.google.com/search?q=" +
                encodeURIComponent(query),
                "_blank"
            );

            speak(
                "Открываю поиск."
            );

        }

        return;
    }


    answer.textContent =
        "BORZ: Команда получена.";

    speak(
        "Команда получена."
    );
}


/* =========================================
   РУССКИЙ ГОЛОС
========================================= */

function speak(text) {

    if (!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "ru-RU";

    speech.rate = 0.95;

    speech.pitch = 0.9;

    speechSynthesis.speak(speech);
}


/* =========================================
   ГОТОВО
========================================= */

console.log(
    "BORZ AI SYSTEM ONLINE"
);

</script>

</body>
</html>
