/* =========================================================
   TOAST
   ========================================================= */

function toast(text){

    const t = $("toast");

    if(!t) return;

    t.textContent = text;
    t.style.display = "block";

    clearTimeout(window.__toastTimer);

    window.__toastTimer = setTimeout(()=>{
        t.style.display = "none";
    },2600);
}


/* =========================================================
   ГОЛОС
   ========================================================= */

function speak(text){

    if(!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(text);

    u.lang = "ru-RU";
    u.rate = .95;
    u.pitch = 1;

    speechSynthesis.speak(u);
}


/* =========================================================

function setStatus(text){

/* =========================================================
   ПОДРОБНАЯ ИНФОРМАЦИЯ ОБ ОБЪЕКТЕ
   ========================================================= */

function updateObject(name, confidence, prediction){

    currentObject = name || "объект";
    currentPrediction = prediction || null;

    const percent =
        confidence
        ? Math.round(confidence * 100)
        : 0;

    $("recognition").innerHTML =
        `<b>${name}</b> · обнаружен · ${percent}%`;

    $("objectName").textContent =
        name.toUpperCase();

    $("objectInfo").innerHTML =
        `Уверенность: <b>${percent}%</b> · ` +
        `тип: ${name}`;

    $("modelStatus").textContent =
        `Готова 3D-модель: ${name}`;

    /*
       Показываем дополнительную информацию
    */

    if(prediction && prediction.bbox){

            `Уверенность: ${percent}% · ` +
            `размер: ${Math.round(w)} × ${Math.round(h)} px`;
    }
}


/* =========================================================
   КАМЕРА
   ========================================================= */

async function startCamera(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        toast(
            "Браузер не поддерживает доступ к камере"
        );

        return false;
    }

    try{

        if(stream){

            $("camera").classList.add("on");

            return true;
        }

        setStatus("Запрашиваю доступ к камере…");

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false
            });


        $("camera").srcObject = stream;

        $("camera").classList.add("on");

        $("recognition").textContent =
            "Камера ONLINE · готова к сканированию";

        $("objectInfo").textContent =
            "Нажми «Сканировать»";

        setStatus(
            "BORZ · камера ONLINE"
        );

        toast(
            "Задняя камера BORZ включена"
        );

        return true;

    }catch(e){

        console.error(e);

        setStatus(
            "Нет доступа к камере"
        );

        toast(
            "Камера: " + (e.name || "доступ запрещён")
        );

        return false;
    }
}

/* =========================================================
   ПОЗИЦИЯ РАМКИ
   ========================================================= */

function showDetectionBox(prediction){

    if(!prediction)
        return;

    const video = $("camera");

    const [x,y,w,h] =
        prediction.bbox;

    const vw =
        video.videoWidth || 1280;

    const vh =
        video.videoHeight || 720;

    /*
       object-fit:cover
       учитываем масштабирование камеры
    */

    const scale =
        Math.max(
            innerWidth / vw,
            innerHeight / vh
        );

    const displayW =
        vw * scale;

    const displayH =
        vh * scale;

    const offsetX =
        (innerWidth - displayW) / 2;

    const offsetY =
        (innerHeight - displayH) / 2;

    const box = $("targetBox");

    box.style.display = "block";

    box.style.left =
        (offsetX + x * scale) + "px";

    box.style.top =
        (offsetY + y * scale) + "px";

    box.style.width =
        Math.max(20,w * scale) + "px";

    box.style.height =
        Math.max(20,h * scale) + "px";

    const name =
        RU[prediction.class] ||
        prediction.class;

    $("targetLabel").textContent =
        `${name.toUpperCase()} · ${Math.round(prediction.score*100)}%`;
}


/* =========================================================
   СКАНИРОВАНИЕ
   ========================================================= */

async function scanObject(){

    if(!stream){

        const ok =
            await startCamera();

        if(!ok)
            return;
    }

    if(!detector){

        const ok =
            await loadDetector();

        if(!ok)
            return;
    }

    if(detecting)
        return;

    detecting = true;

    setStatus(
        "BORZ · анализ изображения…"
    );

    try{

        const video = $("camera");

        await new Promise(resolve=>{

            if(video.readyState >= 2){

                resolve();

            }else{

                video.addEventListener(
                    "loadeddata",
                    resolve,
                    {once:true}
                );
            }
        });


        const predictions =
            await detector.detect(
                video,
                20,
                .35
            );


        if(!predictions.length){

            $("targetBox").style.display =
                "none";

            $("recognition").textContent =
                "Объект не найден";

            $("objectInfo").textContent =
                "Направь камеру на объект";

            $("modelStatus").textContent =
                "Модель не выбрана";

            toast(
                "BORZ не обнаружил объект"
            );

            return;
        }


        /*
           Сортируем по уверенности
        */

        predictions.sort(
            (a,b)=>b.score-a.score
        );


        /*
           Берём самый уверенный объект
        */

        const p =
            predictions[0];

        lastDetection =
            p;


        const name =
            RU[p.class] ||
            p.class;


        updateObject(
            name,
            p.score,
            p
        );


        showDetectionBox(p);


        /*
           Информация обо всех обнаруженных
           объектах
        */

        let allInfo =
            predictions
            .slice(0,8)
            .map((item,index)=>{

                const n =
                    RU[item.class] ||
                    item.class;

                return `${index+1}. ${n} · ${Math.round(item.score*100)}%`;
            })
            .join("<br>");


        $("objectInfo").innerHTML =
            allInfo;


        setStatus(
            `BORZ · найдено объектов: ${predictions.length}`
        );


        toast(
            `Распознано: ${name}`
        );


        /*
           Запоминаем все объекты
        */

        window.borzDetections =
            predictions.map(item=>({

                class:item.class,

                name:
                    RU[item.class] ||
                    item.class,

                score:item.score,

                bbox:item.bbox
            }));


    }catch(e){

        console.error(e);

        toast(
            "Ошибка компьютерного зрения"
        );

        setStatus(
            "Ошибка распознавания"
        );

    }finally{

        detecting = false;
    }
}

            suit
        );

        1.55;

       Руки

        hand.position.set(
            side*.72,
            .98,

        g.add(hand);

    /*
       Ноги

        const leg =

                new THREE.CapsuleGeometry(
                    .16,.95,6,14

                dark

        foot.position.set(
            side*.25,

    return g;

/* =========================================================
   ВЫБОР 3D МОДЕЛИ
   ========================================================= */

function make3DObject(name){

    const n =
        name.toLowerCase();


    if(n.includes("человек"))
        return createPerson();

    if(n.includes("телевизор"))
        return createTV();

    if(n.includes("бутыл"))
        return createBottle();

    if(n.includes("ноутбук"))
        return createLaptop();

    if(n.includes("телефон"))
        return createPhone();

    if(n.includes("стул"))
        return createChair();

    if(n.includes("чаш"))
        return createCup();

    if(
        n.includes("автомоб") ||
        n.includes("машин")
    )
        return createCar();


    return createGeneric();
}


/* =========================================================
   3D ОКНО
   ========================================================= */

function show3D(name){

    if(!window.THREE){

        toast(
            "Three.js не загрузился"
        );

        return;
    }


    $("threePanel").style.display =
        "block";


    $("threeTitle").textContent =
        "BORZ · 3D · " +
        name.toUpperCase();


    $("modelStatus").textContent =
        "3D: " + name;


    $("objectName").textContent =
        "3D · " + name.toUpperCase();


    $("objectInfo").textContent =
        "3D-модель построена";


    /*
       Небольшая задержка нужна iPhone,
       чтобы canvas получил реальные размеры.
    */

    requestAnimationFrame(()=>{

        initThree(name);

    });


    toast(
        "3D-модель: " + name
    );
}


/* =========================================================
   INIT THREE
   ========================================================= */

function initThree(name){

    /*
       Уничтожаем старую сцену
    */

    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }


    if(threeState){

        try{

            threeState.renderer.dispose();

        }catch(e){}

        threeState = null;
    }


    const canvas =
        $("threeCanvas");


    const panel =
        $("threePanel");


    if(!canvas || !panel){

        toast(
            "3D canvas не найден"
        );

        return;
    }


    /*
       СЦЕНА
    */

    const scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x02070b
        );


    /*
       КАМЕРА
    */

    const camera =
        new THREE.PerspectiveCamera(
            42,
            1,
            .01,
            100
        );


    camera.position.set(
        4,
        3,
        7
    );


    /*
       RENDERER
    */

    let renderer;


    try{

        renderer =
            new THREE.WebGLRenderer({

                canvas:canvas,

                antialias:true,

                alpha:false,

                powerPreference:"high-performance"
            });

    }catch(e){

        console.error(e);

        toast(
            "WebGL не поддерживается этим браузером"
        );

        return;
    }


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.15;


    /*
       СВЕТ
    */

    scene.add(
        new THREE.HemisphereLight(
            0x9beaff,
            0x061018,
            1.7
        )
    );


    const key =
        new THREE.DirectionalLight(
            0xffffff,
            2.4
        );

    key.position.set(
        4,
        7,
        6
    );

    scene.add(key);


    const fill =
        new THREE.PointLight(
            0x35dfff,
            4,
            12
        );

    fill.position.set(
        -4,
        3,
        4
    );

    scene.add(fill);


    /*
       ПОЛ
    */

    const grid =
        new THREE.GridHelper(
            8,
            20,
            0x166273,
            0x0b2831
        );

    grid.position.y =
        -1.25;

    scene.add(grid);


    /*
       МОДЕЛЬ
    */

    const object =
        make3DObject(name);


    scene.add(object);


    /*
       АВТОМАСШТАБИРОВАНИЕ
    */

    const box =
        new THREE.Box3()
            .setFromObject(object);


    const size =
        new THREE.Vector3();

    const center =
        new THREE.Vector3();


    box.getSize(size);
    box.getCenter(center);


    object.position.x -=
        center.x;

    object.position.y -=
        center.y;

    object.position.z -=
        center.z;


    /*
       Нормализуем размер
    */

    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(maxSize > 0){

        const scale =
            3.1 / maxSize;

        object.scale.setScalar(
            scale
        );
    }


    /*
       После масштабирования
       ставим объект над сеткой
    */

    const newBox =
        new THREE.Box3()
            .setFromObject(object);


    object.position.y +=
        -newBox.min.y - 1.15;


    /*
       RESIZE
    */

    function resize(){

        const w =
            panel.clientWidth;

        const h =
            panel.clientHeight;


        if(
            w <= 0 ||
            h <= 0
        )
            return;


        renderer.setSize(
            w,
            h,
            false
        );


        camera.aspect =
            w / h;


        camera.updateProjectionMatrix();
    }


    resize();


    /*
       TOUCH / MOUSE
    */

    let dragging = false;

    let lastX = 0;

    let lastY = 0;


    canvas.onpointerdown =
        e => {

            dragging = true;

            lastX =
                e.clientX;

            lastY =
                e.clientY;

            canvas.setPointerCapture(
                e.pointerId
            );
        };


    canvas.onpointermove =
        e => {

            if(!dragging)
                return;


            const dx =
                e.clientX - lastX;

            const dy =
                e.clientY - lastY;


            object.rotation.y +=
                dx * .012;


            object.rotation.x +=
                dy * .008;


            object.rotation.x =
                Math.max(
                    -1.1,
                    Math.min(
                        1.1,
                        object.rotation.x
                    )
                );


            lastX =
                e.clientX;

            lastY =
                e.clientY;
        };


    canvas.onpointerup =
    canvas.onpointercancel =
    canvas.onpointerleave =
        e => {

            dragging = false;
        };


    /*
       Сохраняем состояние
    */

    threeState = {

        scene,

        camera,

        renderer,

        object,

        resize
    };


    /*
       RENDER LOOP
    */

    function animate(){

        if(
            $("threePanel").style.display ===
            "none"
        ){

            animationFrame = null;

            return;
        }


        if(!dragging){

            object.rotation.y +=
                .004;
        }


        renderer.render(
            scene,
            camera
        );


        animationFrame =
            requestAnimationFrame(
                animate
            );
    }


    animate();


    /*
       RESIZE WINDOW
    */

    setTimeout(
        resize,
        100
    );

    setTimeout(
        resize,
        500
    );
}


/* =========================================================
   ЗАКРЫТЬ 3D
   ========================================================= */

$("close3d").onclick = ()=>{

    $("threePanel").style.display =
        "none";


    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }


    setStatus(
        "BORZ · готов"
    );
};


/* =========================================================
   3D BUTTON
   ========================================================= */

$("threeBtn").onclick = ()=>{

    if(
        !currentObject ||
        currentObject === "объект"
    ){

        toast(
            "Сначала просканируй объект"
        );

        return;
    }


    show3D(
        currentObject
    );
};


/* =========================================================
   AI
   ========================================================= */

function openAI(){

    $("aiPanel").style.display =
        "block";

    $("aiInput").focus();
}


function closeAI(){

    $("aiPanel").style.display =
        "none";
}


function runCommand(q){

    const l =
        q.toLowerCase().trim();


    if(!l)
        return;


    $("aiStatus").textContent =
        "Выполняю: " + q;


    /*
       3D
    */

    if(
        l.includes("3d") ||
        l.includes("трехмер") ||
        l.includes("модель")
    ){

        let name =
            currentObject;


        if(l.includes("человек"))
            name = "человек";

        else if(l.includes("телевизор"))
            name = "телевизор";

        else if(l.includes("бутыл"))
            name = "бутылка";

        else if(l.includes("стул"))
            name = "стул";

        else if(
            l.includes("автомоб") ||
            l.includes("машин")
        )
            name = "автомобиль";

        else if(l.includes("ноутбук"))
            name = "ноутбук";

        else if(l.includes("телефон"))
            name = "телефон";

        else if(l.includes("чаш"))
            name = "чашка";


        currentObject =
            name;


        show3D(name);

        speak(
            "Открываю 3D модель " +
            name
        );

        return;
    }


    /*
       Камера
    */

    if(l.includes("камер")){

        startCamera();

        return;
    }


    /*
       Сканирование
    */

    if(
        l.includes("скан") ||
        l.includes("распозн")
    ){

        scanObject();

        return;
    }


    /*
       Навигация
    */

    if(
        l.includes("навига") ||
        l.includes("маршрут")
    ){

        navigate();

        return;
    }


    /*
       Поиск
    */

    if(l.includes("поиск")){

        const q2 =
            l
            .replace(
                /поиск|найди|найти/g,
                ""
            )
            .trim()
            ||
            currentObject;


        window.open(
            "https://www.google.com/search?q=" +
            encodeURIComponent(q2),
            "_blank"
        );

        return;
    }


    toast(
        "Команда пока не подключена"
    );
}


/* =========================================================
   AI BUTTONS
   ========================================================= */

$("aiBtn").onclick =
    openAI;


$("closeAI").onclick =
    closeAI;


$("runAI").onclick =
    ()=>{

        runCommand(
            $("aiInput").value
        );
    };


$("aiInput").addEventListener(
    "keydown",
    e => {

        if(e.key === "Enter"){

            runCommand(
                $("aiInput").value
            );
        }
    }
);


/* =========================================================
   ГОЛОС
   ========================================================= */

function voice(){

    const SR =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SR){

        toast(
            "Голосовой ввод не поддерживается"
        );

        return;
    }


    recognition =
        new SR();


    recognition.lang =
        "ru-RU";


    recognition.interimResults =
        false;


    recognition.continuous =
        false;


    recognition.onstart =
        ()=>{

            $("voiceBtn")
                .classList.add("active");


            setStatus(
                "BORZ · слушаю…"
            );


            $("aiStatus").textContent =
                "Слушаю команду…";
        };


    recognition.onresult =
        e => {

            const text =
                e.results[0][0]
                .transcript;


            $("aiStatus").textContent =
                "Вы: " + text;


            runCommand(text);
        };


    recognition.onerror =
        e => {

            toast(
                "Ошибка голоса: " +
                e.error
            );
        };


    recognition.onend =
        ()=>{

            $("voiceBtn")
                .classList.remove(
                    "active"
                );


            setStatus(
                "BORZ · готов"
            );
        };


    try{

        recognition.start();

    }catch(e){}
}


/* =========================================================
   НАВИГАЦИЯ
   ========================================================= */

function navigate(){

    if(!navigator.geolocation){

        window.open(
            "https://www.google.com/maps",
            "_blank"
        );

        return;
    }


    setStatus(
        "BORZ · определяю GPS…"
    );


    navigator.geolocation.getCurrentPosition(

        p => {

            const lat =
                p.coords.latitude
                .toFixed(6);


            const lon =
                p.coords.longitude
                .toFixed(6);


            $("routeText").textContent =
                `GPS ${lat}, ${lon}`;


            setStatus(
                "BORZ · GPS ONLINE"
            );


            toast(
                "GPS получен"
            );


            window.open(
                `https://www.google.com/maps/dir/?api=1&origin=${lat},${lon}`,
                "_blank"
            );
        },


        () => {

            toast(
                "Разреши геолокацию для сайта"
            );


            setStatus(
                "GPS · нет доступа"
            );
        },


        {
            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:5000
        }
    );
}


/* =========================================================
   КНОПКИ
   ========================================================= */

$("cameraBtn").onclick =
    async ()=>{

        const ok =
            await startCamera();

        if(
            ok &&
            !detector
        ){

            loadDetector();
        }
    };


$("scanBtn").onclick =
    scanObject;


$("voiceBtn").onclick =
    voice;


$("navBtn").onclick =
    navigate;


/* =========================================================
   ЗАПУСК
   ========================================================= */

window.addEventListener(
    "load",
    ()=>{

        setStatus(
            "SYSTEM ONLINE · 100%"
        );


        setTimeout(
            ()=>{

                setStatus(
                    "BORZ · готов"
                );


                $("aiStatus").textContent =
                    "BORZ активирован. Я готов.";
            },
            700
        );
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        if(
            threeState &&
            threeState.resize
        ){

            threeState.resize();
        }
    }
);

</script>
